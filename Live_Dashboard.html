<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV India - Analytics Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            min-width: 250px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .count {
            font-size: 5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .live-count {
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            color: #00ff88;
        }
        
        .daily-count {
            text-shadow: 0 0 20px rgba(0, 162, 255, 0.5);
            color: #00a2ff;
        }

        .total-count {
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            color: #ffcc00;
        }

        .status {
            font-size: 1rem;
            color: #aaa;
            margin-top: 20px;
            text-align: center;
        }

        .pulse {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 10px;
            box-shadow: 0 0 0 0 rgba(0, 255, 136, 1);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <h2 style="font-weight: 300; letter-spacing: 3px; margin-bottom: 40px;">IPTV INDIA ANALYTICS</h2>

    <div class="dashboard-container">
        <!-- Live Users -->
        <div class="dashboard-card">
            <h1><span class="pulse"></span>Online Now</h1>
            <div class="count live-count" id="live-count">0</div>
            <div style="color: #bbb; font-size: 0.9rem;">(Active in last 2 mins)</div>
        </div>

        <!-- Daily Active Users -->
        <div class="dashboard-card">
            <h1>Daily Active</h1>
            <div class="count daily-count" id="daily-count">0</div>
            <div style="color: #bbb; font-size: 0.9rem;">(Active in last 24 hours)</div>
        </div>

        <!-- Total Users -->
        <div class="dashboard-card">
            <h1>Total Users</h1>
            <div class="count total-count" id="total-count">0</div>
            <div style="color: #bbb; font-size: 0.9rem;">(All time unique installs)</div>
        </div>
    </div>
    
    <div class="status" id="status">Waiting for data...</div>

    <script>
        const FIREBASE_URL = "https://iptvindiaxtreamplayer-default-rtdb.asia-southeast1.firebasedatabase.app/live_users.json";
        
        const LIVE_THRESHOLD_MS = 120000; // 2 minutes
        const DAILY_THRESHOLD_MS = 86400000; // 24 hours

        async function fetchAnalytics() {
            try {
                document.getElementById('status').innerText = "Refreshing...";
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                if (!data) {
                    document.getElementById('live-count').innerText = "0";
                    document.getElementById('daily-count').innerText = "0";
                    document.getElementById('total-count').innerText = "0";
                    document.getElementById('status').innerText = "Last updated: Just now";
                    return;
                }

                const now = Date.now();
                let liveCount = 0;
                let dailyCount = 0;
                let totalCount = 0;

                for (const deviceId in data) {
                    const user = data[deviceId];
                    if (user && user.last_active) {
                        totalCount++; // Count every unique device

                        const timeSinceLastActive = now - user.last_active;
                        
                        if (timeSinceLastActive < LIVE_THRESHOLD_MS) {
                            liveCount++;
                        }
                        
                        if (timeSinceLastActive < DAILY_THRESHOLD_MS) {
                            dailyCount++;
                        }
                    }
                }

                document.getElementById('live-count').innerText = liveCount;
                document.getElementById('daily-count').innerText = dailyCount;
                document.getElementById('total-count').innerText = totalCount;
                document.getElementById('status').innerText = "Last updated: Just now (Auto-refreshes every 10s)";

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('status').innerText = "Error connecting to database.";
            }
        }

        // Fetch immediately on load
        fetchAnalytics();

        // Fetch every 10 seconds
        setInterval(fetchAnalytics, 10000);
    </script>
</body>
</html>
